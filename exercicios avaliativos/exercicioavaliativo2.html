                <body>
                    <form action="">
                     
                        <h1>Cadastre e concorra! </h1>
                        <label for="Nome">Nome</label>
                        <br>
                        <input type="Nome" id="Nome" placeholder="Digite seu nome" />
                        <br>
                        <br>
                        <label for="e-mail">E-mail</label>
                        <br>
                        <input type="email" id="email" placeholder="Digite seu e-mail" />
                        <br>
                        <br>
                        <label for="Data">Data</label>
                        <br>
                        <input type="Data de nascimento" id="Data de nascimento" placeholder="mm/dd/yyyy" />
                        <br>
                        <br>
                        <label for="CPF">CPF</label>
                        <br>
                        <input type="CPF" id="CPF" placeholder="Digite seu CPF" />
                        <br>
                        <br>
                        <label for="CEP">CEP</label>
                        <br>
                        <input type="CEP" id="CEP" placeholder="Digite seu CEP" />
                        <input type="Estado" id="Estado" placeholder="Digite seu estado" />
                        <br>
                        <br>
                        <label for="Cidade">Cidade</label> <label for="Bairro">Bairro</label>
                        <br>
                        <input type="Cidade" id="Cidade" placeholder="Digite sua cidade" />
                    
                        <input type="Bairro" id="Bairro" placeholder="Digite seu bairro" />
                        <br>
                        <br>
                        <label for="Rua">Rua</label>  <label for="Complemento">Complemento</label>
                        <br>
                        <input type="Rua" id="Rua" placeholder="Digite sua rua" />
                        <input type="Complemento" id="Complemento" placeholder="Digite o complemento(ex: apot 122)" />
                        <br>
                        <br>
                        <button>Entrar</button>
                        
                       
                    </form>
